<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subject Management</title>

<style>

/* Layout */
body{
margin:0;
font-family:Segoe UI;
background:#f4f6f9;
}

.layout{
display:flex;
}

/* Sidebar */
.sidebar{
width:230px;
background:white;
height:100vh;
padding:20px;
box-shadow:2px 0 10px rgba(0,0,0,0.05);
}

.profile{
text-align:center;
margin-bottom:30px;
}

.avatar{
width:80px;
height:80px;
background:#ccc;
border-radius:50%;
margin:auto;
}

.profile h3{
margin-top:10px;
}

.sidebar ul{
list-style:none;
padding:0;
}

.sidebar ul li{
padding:12px;
cursor:pointer;
border-radius:6px;
margin-bottom:5px;
}

.sidebar ul li:hover{
background:#f0f0f0;
}

.logout{
margin-top:20px;
width:100%;
background:#ef4444;
border:none;
padding:10px;
color:white;
border-radius:6px;
cursor:pointer;
}

/* Content */
.content{
flex:1;
padding:40px;
}

/* Card */
.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
margin-bottom:20px;
}

label{
display:block;
margin-top:10px;
}

input,select{
width:100%;
height:40px;
margin-top:5px;
padding:8px;
border:1px solid #ccc;
border-radius:6px;
}

/* File */
.file-container{
display:flex;
align-items:center;
gap:10px;
margin-top:5px;
}

.file-container input{
display:none;
}

.file-btn{
background:#3b82f6;
color:white;
padding:6px 12px;
border-radius:6px;
cursor:pointer;
}

/* Button */
.submit{
margin-top:20px;
background:#22c55e;
border:none;
padding:12px;
color:white;
border-radius:6px;
width:100%;
cursor:pointer;
}

/* Subject list */
.subject-list{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.subject{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
border:1px solid #eee;
border-radius:6px;
margin-top:10px;
}

.tag{
background:#e0f2fe;
padding:4px 10px;
border-radius:20px;
font-size:12px;
margin-left:10px;
}

.file{
background:#dcfce7;
padding:4px 10px;
border-radius:20px;
font-size:12px;
cursor:pointer;
}

.delete{
background:#ef4444;
border:none;
color:white;
padding:6px 10px;
border-radius:5px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="layout">
<aside class="sidebar">

<div class="profile">
<div class="avatar"></div>
<h3 id="facultyName">Faculty</h3>
</div>

<ul>
<li onclick="location.href='dashboard.html'">Dashboard</li>
<li onclick="location.href='analytics.html'">Analytics</li>
<li onclick="location.href='aicte-pos.html'">AICTE POs</li>
<li onclick="location.href='attainment.html'">Attainment</li>
<li onclick="location.href='question-detection.html'">Question → CO Detection</li>
<li onclick="location.href='addsubject.html'">Add Subject</li>
</ul>

<button class="logout" onclick="logout()">Logout</button>

</aside>

<!-- Content -->
<div class="content">

<div class="card">
<h2>Subject Management</h2>

<label>Subject Name</label>
<input type="text" id="subjectName">

<label>Semester</label>
<select id="semester">
<option value="">Select Semester</option>
<option>Semester I</option>
<option>Semester II</option>
<option>Semester III</option>
<option>Semester IV</option>
<option>Semester V</option>
<option>Semester VI</option>
</select>

<label>Upload Syllabus</label>
<div class="file-container">
<input type="file" id="file">
<label for="file" class="file-btn">Choose File</label>
<span id="file-name">No file</span>
</div>

<button class="submit" onclick="addSubject()">+ Add Subject</button>
</div>

<div class="subject-list">
<h3>Your Subjects</h3>
<div id="subjects"></div>
</div>

</div>
</div>

<script>

let subjects = [];
const BASE_URL =
  window.API_BASE_URL || localStorage.getItem("apiBaseUrl") || "http://127.0.0.1:9000";

// 🔥 INIT AFTER PAGE LOAD
window.onload = function(){
    loadSubjects();

    document.getElementById("file").addEventListener("change", function(){
        document.getElementById("file-name").textContent =
        this.files[0]?.name || "No file";
    });
};

// 🔥 LOAD
async function loadSubjects(){
    try{
        const res = await fetch(`${BASE_URL}/subjects`);
        const data = await res.json();

        console.log("API DATA:", data);

        subjects = data;
        renderSubjects();

    }catch(err){
        console.error("Load error:", err);
    }
}

// 🔥 RENDER
function renderSubjects(){
    const container = document.getElementById("subjects");
    container.innerHTML = "";

    if(subjects.length === 0){
        container.innerHTML = "<p>No subjects found</p>";
        return;
    }

    subjects.forEach(sub=>{
        container.innerHTML += `
        <div class="subject">
            <div>
                <b>${sub.subjectName || "No Name"}</b>
                <span class="tag">${sub.semester || ""}</span>
                <span class="file" onclick="openFile('${sub.file}')">
                    ${sub.file || "No File"}
                </span>
            </div>

            <button class="delete"
            onclick="deleteSubject('${sub._id}')">🗑</button>
        </div>`;
    });
}

// 🔥 ADD
async function addSubject(){

console.log("Add clicked");

const name = document.getElementById("subjectName").value;
const semester = document.getElementById("semester").value;
const file = document.getElementById("file").files[0];

if(name === "" || semester === ""){
    alert("Fill all fields");
    return;
}

const formData = new FormData();
formData.append("subjectName", name);
formData.append("semester", semester);

if(file){
    formData.append("file", file);
}

try{
    const res = await fetch(`${BASE_URL}/add-subject`,{
        method:"POST",
        body:formData
    });

    const data = await res.json();
    console.log("ADD RESPONSE:", data);

    alert("Saved successfully");

    loadSubjects();

}catch(err){
    console.error("Add error:", err);
    alert("Backend connection error");
}

// reset
document.getElementById("subjectName").value = "";
document.getElementById("semester").value = "";
document.getElementById("file").value = "";
document.getElementById("file-name").textContent = "No file";

}

// 🔥 DELETE
async function deleteSubject(id){
    try{
        const res = await fetch(`${BASE_URL}/delete-subject/${id}`,{
            method:"DELETE"
        });

        const data = await res.json();
        console.log("DELETE RESPONSE:", data);

        loadSubjects();

    }catch(err){
        console.error("Delete error:", err);
    }
}

// 🔥 OPEN FILE
function openFile(filename){
    if(!filename){
        alert("No file available");
        return;
    }
    window.open(`${BASE_URL}/file/${filename}`);
}

</script>
<script src="page-navigation.js"></script>
</body>
</html>
